name: Research validation
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application metadata
        run: python3 scripts/validate_applications.py
      - name: Validate planning and coverage
        run: python3 scripts/validate_planning.py
      - name: Test evidence and planning failure cases
        run: python3 -m unittest discover -s tests -v
